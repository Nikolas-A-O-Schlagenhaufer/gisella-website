{% extends "layout.html" %} {% block head %}
<script
  type="module"
  src="{{ url_for('static', path='js/signin.js') }}"
></script>
{% endblock head %} {% block content %}
<form id="signin_form" class="flex flex-col items-start gap-2 p-2">
  <div class="flex flex-col gap-1">
    <label for="username_input">Nome de Usuário</label>
    <input
      id="username_input"
      type="text"
      name="username"
      class="px-2 py-1"
      maxlength="255"
      autocomplete="off"
      required
    />
  </div>
  <div class="flex flex-col gap-1">
    <label for="email_input">Email</label>
    <input
      id="email_input"
      type="email"
      name="email"
      class="px-2 py-1"
      maxlength="255"
      autocomplete="email"
      required
    />
  </div>
  <div class="flex flex-col gap-1">
    <label for="password_input">Senha</label>
    <input
      id="password_input"
      type="password"
      name="password"
      class="px-2 py-1"
      maxlength="255"
      minlength="8"
      autocomplete="off"
      required
    />
  </div>
  <div class="flex flex-col gap-1">
    <label for="confirm_password_input">Confirme a Senha</label>
    <input
      id="confirm_password_input"
      type="password"
      name="confirm_password"
      class="px-2 py-1"
      maxlength="255"
      minlength="8"
      autocomplete="off"
      required
    />
    <div id="confirm_password_feedback" class="hidden"></div>
  </div>
  <button
    id="signin_form_submit_button"
    type="submit"
    class="rounded-md px-4 py-2 shadow-sm bg-lime-500 text-slate-900 hover:bg-lime-600 hover:cursor-pointer"
  >
    Cadastrar
  </button>
</form>
{% endblock content %}
