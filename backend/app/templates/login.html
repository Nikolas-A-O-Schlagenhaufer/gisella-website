{% extends "layout.html" %} {% block head %}
<script
  type="module"
  src="{{ url_for('static', path='js/login.js') }}"
></script>
{% endblock head %} {% block content %}
<form id="login_form" class="flex flex-col items-start gap-2 p-2">
  <div class="flex flex-col gap-1">
    <label for="email_input">Email</label>
    <input
      id="email_input"
      type="email"
      name="username"
      class="px-2 py-1"
      maxlength="255"
      autocomplete="email"
      required
    />
  </div>
  <div class="flex flex-col gap-1">
    <label for="password_input">Senha</label>
    <input
      id="password_input"
      type="password"
      name="password"
      class="px-2 py-1"
      maxlength="255"
      minlength="8"
      autocomplete="off"
      required
    />
  </div>
  <button
    id="login_form_submit_button"
    type="submit"
    class="rounded-md px-4 py-2 shadow-sm bg-lime-500 text-slate-900 hover:bg-lime-600 hover:cursor-pointer"
  >
    Entrar
  </button>
</form>
{% endblock content %}
